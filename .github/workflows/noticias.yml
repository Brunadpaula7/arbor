name: Atualizar Journal (notícias)

on:
  schedule:
    - cron: "0 9,15,21 * * *"   # 06h, 12h e 18h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar notícias
        run: python3 scripts/update_news.py
      - name: Publicar se houve mudança
        run: |
          if git diff --quiet -- noticias.json; then
            echo "Sem novidades."
          else
            git config user.name "arbor-journal-bot"
            git config user.email "actions@users.noreply.github.com"
            git add noticias.json
            git commit -m "chore: atualizar notícias do Journal"
            git push
          fi
